[package]
name = "zaiken-daemon"
version = "0.1.0"
edition = "2021"
description = "Zaiken high-performance native daemon (metrics + game scan)"
authors = ["Zaid Bilal Banat"]
license = "UNLICENSED"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
walkdir = "2"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
