services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zaiken
      POSTGRES_USER: zaiken
      POSTGRES_PASSWORD: change-me-before-production
    ports:
      - "5432:5432"
    volumes:
      - zaiken-postgres:/var/lib/postgresql/data
      - ./server/db:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - zaiken-redis:/data
volumes:
  zaiken-postgres:
  zaiken-redis:
